# docker-compose.minio.yml
# Configuración de MinIO para desarrollo local
# Uso: docker-compose -f docker-compose.minio.yml up -d

services:
  minio:
    image: minio/minio:latest
    container_name: cupido-minio
    ports:
      - "9000:9000"   # API S3
      - "9001:9001"   # Console Web
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped

  # Servicio para crear el bucket automáticamente al iniciar
  minio-setup:
    image: minio/mc:latest
    container_name: cupido-minio-setup
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb local/cupido-media --ignore-existing;
      mc anonymous set public local/cupido-media;
      echo 'Bucket cupido-media creado y configurado como público';
      exit 0;
      "

volumes:
  minio_data:
    driver: local
